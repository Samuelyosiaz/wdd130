                    <figcaption>In our White Water Rafting experience, we’re not just taking you down a river — we’re helping you reconnect with nature and with yourself. Every descent is a chance to break away from routine, build teamwork, and feel the adrenaline of facing the rapids. We’re passionate about creating moments that blend excitement, camaraderie, and breathtaking scenery. For us, rafting isn’t just a sport — it’s a way of living adventure with purpose.
                    </figcaption>

                <figure>
                    <img src="images/group-travels.jpg" alt="Group Trips">
                    <figcaption>We guide you through carefully selected routes based on your experience level, from gentle stretches for beginners to challenging rapids for thrill-seekers. We provide all necessary gear — life vest, helmet, paddle — and our certified guides know every bend of the river. Our packages include local transportation, photos of your journey, and in some cases, meals and extra activities like hiking or campfires. We want you to enjoy a full, safe, and unforgettable day.</figcaption>
                </figure>
